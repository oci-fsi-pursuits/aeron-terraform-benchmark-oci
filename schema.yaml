---
title: "Aeron Deployment for OCI"
description: "Deploy Aeron messaging system with controller, benchmark nodes, and optional failover for high-performance benchmarking on Oracle Cloud Infrastructure"
schemaVersion: 1.1.0
version: "1.0.0"
locale: "en"

logoUrl: https://raw.githubusercontent.com/real-logic/aeron/master/aeron-logo.png

outputs:
  controller_public_ip:
    title: "Controller Node Public IP"
    type: copyableString
    visible: true

  controller_ssh_command:
    title: "SSH Command (Controller)"
    type: copyableString
    visible: true

  client_node_ip:
    title: "Client Node Private IP"
    type: copyableString
    visible: true

  receiver_node_ip:
    title: "Receiver Node Private IP"
    type: copyableString
    visible: true

  failover_private_ip:
    title: "Failover Node Private IP"
    type: copyableString
    visible: true

  benchmark_command:
    title: "Benchmark Command"
    type: copyableString
    visible: true

variableGroups:
  - title: "Basic Configuration"
    variables:
      - compartment_ocid
      - ssh_public_key
      - use_custom_name
      - cluster_name

  - title: "Controller Node (Orchestrator - Public Subnet)"
    variables:
      - controller_ad
      - controller_shape
      - controller_ocpus
      - controller_memory_gb
      - controller_boot_volume_size_gb

  - title: "Benchmark Nodes (Client/Receiver - Private Subnet)"
    variables:
      - benchmark_ad
      - benchmark_node_count
      - enable_cluster_raft_consensus
      - benchmark_shape
      - benchmark_ocpus
      - benchmark_memory_gb
      - benchmark_boot_volume_size_gb

  - title: "Failover Node (Private Subnet - Different AD)"
    variables:
      - enable_failover_node
      - failover_ad
      - failover_shape
      - failover_ocpus
      - failover_memory_gb
      - failover_boot_volume_size_gb

  - title: "Performance Settings"
    variables:
      - hyperthreading

  - title: "Network Configuration"
    variables:
      - use_existing_vcn
      - create_benchmark_cluster_placement_group
      - enable_benchmark_cluster_network
      - enable_benchmark_instance_pool
      - enable_rdma_compute_cluster
      - rdma_existing_compute_cluster_id
      - rdma_enable_hpc_plugins
      - benchmark_cloud_init_rdma
      - benchmark_cloud_init_rdma_interface
      - benchmark_cloud_init_rdma_configure_netplan
      - benchmark_cloud_init_rdma_ipv4_prefix
      - benchmark_cloud_init_rdma_prefix_length
      - benchmark_cloud_init_rdma_mtu
      - vcn_compartment_ocid
      - existing_vcn_id
      - existing_public_subnet_id
      - existing_private_subnet_id
      - vcn_cidr_block
      - public_subnet_cidr
      - private_subnet_cidr
      - aeron_benchmark_udp_ingress_cidr
      - aeron_benchmark_configure_host_firewall
      - aeron_benchmark_host_firewall_persistent
      - private_deployment

  - title: "Image Configuration"
    variables:
      - use_default_image
      - marketplace_image
      - custom_image_ocid

  - title: "Aeron Configuration"
    variables:
      - install_aeron
      - install_oci_cn_auth
      - benchmark_tuning_profile
      - run_smoke_test
      - run_full_benchmark
      - run_benchmarks_matrix_modes
      - run_benchmarks_cluster_matrix
      - benchmark_build_native_aeronmd

  - title: "Hidden Variables"
    variables:
      - tenancy_ocid
      - region
      - ssh_username
      - use_instance_principal
      - default_image_name
      - benchmark_cluster_cpu_affinity
      - grub_dynamic_cpu_isolation
      - grub_housekeeping_fraction
      - grub_housekeeping_floor
      - grub_housekeeping_cpus_max
      - aeron_git_repo
      - aeron_git_branch
      - benchmarks_repo_url
      - benchmarks_git_branch
      - java_version
      - benchmark_echo_runs
      - benchmark_echo_iterations
      - benchmark_echo_warmup_iterations
      - benchmark_echo_warmup_message_rate
      - benchmark_message_length
      - benchmark_message_rate
      - full_benchmark_echo_runs
      - full_benchmark_echo_iterations
      - full_benchmark_echo_warmup_iterations
      - full_benchmark_warmup_message_rate
      - full_benchmark_message_length
      - full_benchmark_message_rate
      - full_benchmark_bench_profile
      - full_benchmark_matrix_mode_timeout_sec
      - aeron_echo_udp_interface_prefix_length
      - aeron_echo_udp_named_interface
      - benchmark_onload_command_vma
      - benchmark_aeron_socket_so_sndbuf
      - benchmark_aeron_socket_so_rcvbuf
      - benchmark_aeron_rcv_initial_window_length
      - benchmark_aeron_max_messages_per_send
      - benchmark_aeron_receiver_io_vector_capacity
      - benchmark_aeron_sender_io_vector_capacity
    visible: false

variables:
  tenancy_ocid:
    type: string
    title: "Tenancy OCID"
    required: true

  region:
    type: oci:identity:region:name
    title: "Region"
    required: true

  compartment_ocid:
    type: oci:identity:compartment:id
    title: "Compartment"
    description: "Compartment where resources will be created"
    required: true
    dependsOn:
      compartmentId: ${tenancy_ocid}

  ssh_public_key:
    type: oci:core:ssh:publickey
    title: "SSH Public Key"
    description: "Public SSH key for instance access"
    required: true

  use_custom_name:
    type: boolean
    title: "Use Custom Cluster Name"
    description: "Use a custom name instead of auto-generated"
    default: false

  cluster_name:
    type: string
    title: "Cluster Name"
    description: "Name prefix for all resources"
    default: "aeron"
    visible:
      eq:
        - ${use_custom_name}
        - true
    required: true

  instance_hostname_prefix:
    type: string
    title: "VNIC hostname prefix (optional)"
    description: "DNS-safe prefix for instance hostname labels when subnets are shared across stacks. Leave empty to auto-derive (custom cluster names append a unique pet suffix)."
    default: ""

  # ==========================================================================
  # Controller Node Configuration (Public Subnet - Orchestrator)
  # ==========================================================================
  controller_ad:
    type: oci:identity:availabilitydomain:name
    title: "Controller Node Availability Domain"
    description: "AD for the controller/orchestrator node (deployed in public subnet)"
    required: true
    dependsOn:
      compartmentId: ${compartment_ocid}

  controller_shape:
    type: oci:core:instanceshape:name
    title: "Controller Node Shape"
    description: "Compute shape for the controller (orchestrator only, smaller is fine)"
    default: "VM.Standard.E6.Flex"
    required: true
    dependsOn:
      compartmentId: ${compartment_ocid}

  controller_ocpus:
    type: integer
    title: "Controller Node OCPUs"
    description: "Number of OCPUs for controller (orchestrator only, no minimum)"
    minimum: 1
    maximum: 64
    default: 2
    required: true
    visible:
      or:
        - eq:
            - ${controller_shape}
            - "VM.Standard.E3.Flex"
        - eq:
            - ${controller_shape}
            - "VM.Standard.E4.Flex"
        - eq:
            - ${controller_shape}
            - "VM.Standard.E5.Flex"
        - eq:
            - ${controller_shape}
            - "VM.Standard.E6.Flex"
        - eq:
            - ${controller_shape}
            - "VM.Standard3.Flex"
        - eq:
            - ${controller_shape}
            - "VM.Optimized3.Flex"
        - eq:
            - ${controller_shape}
            - "VM.Standard.A1.Flex"

  controller_memory_gb:
    type: integer
    title: "Controller Node Memory (GB)"
    description: "Memory in GB for controller"
    minimum: 8
    maximum: 256
    default: 16
    required: true
    visible:
      or:
        - eq:
            - ${controller_shape}
            - "VM.Standard.E3.Flex"
        - eq:
            - ${controller_shape}
            - "VM.Standard.E4.Flex"
        - eq:
            - ${controller_shape}
            - "VM.Standard.E5.Flex"
        - eq:
            - ${controller_shape}
            - "VM.Standard.E6.Flex"
        - eq:
            - ${controller_shape}
            - "VM.Standard3.Flex"
        - eq:
            - ${controller_shape}
            - "VM.Optimized3.Flex"
        - eq:
            - ${controller_shape}
            - "VM.Standard.A1.Flex"

  controller_boot_volume_size_gb:
    type: integer
    title: "Controller Boot Volume Size (GB)"
    minimum: 50
    maximum: 1024
    default: 100
    required: true

  # ==========================================================================
  # Benchmark Nodes Configuration (Private Subnet - Client/Receiver)
  # ==========================================================================
  benchmark_ad:
    type: oci:identity:availabilitydomain:name
    title: "Benchmark Nodes Availability Domain"
    description: "AD for benchmark nodes (client/receiver) - all deployed in same AD"
    required: true
    dependsOn:
      compartmentId: ${compartment_ocid}

  benchmark_node_count:
    type: integer
    title: "Number of Benchmark Nodes"
    description: "Number of benchmark nodes to deploy (minimum 2 for client/receiver). If Raft consensus is enabled, Terraform provisions at least 4 benchmark instances for client + node0/node1/node2."
    minimum: 2
    maximum: 10
    default: 2
    required: true

  enable_cluster_raft_consensus:
    type: boolean
    title: "Enable 3-Member Cluster Consensus"
    description: "Provision/render a 3-member Aeron Cluster benchmark topology (CLUSTER_SIZE=3, CLUSTER_BACKUP_NODES=0). This is separate from the default 1 member + ClusterBackupNode fallback topology."
    default: false
    required: false

  benchmark_tuning_profile:
    type: enum
    title: "Benchmark Tuning Profile"
    description: "auto selects bm_rdma when RDMA cloud-init is enabled and vm_stable otherwise. bm_rdma uses validated BM RDMA/VMA launch, native c-media-driver for cluster java_vma, /dev/shm fixup, static eth1 NUMA pins, and high-rate Aeron socket/batching values; vm_stable keeps VM-safe 2m/1 Aeron values."
    enum:
      - auto
      - bm_rdma
      - vm_stable
    default: auto
    required: false

  benchmark_shape:
    type: oci:core:instanceshape:name
    title: "Benchmark Node Shape"
    description: "Compute shape for benchmark nodes (high performance recommended)"
    default: "VM.Standard.E6.Flex"
    required: true
    dependsOn:
      compartmentId: ${compartment_ocid}

  benchmark_ocpus:
    type: integer
    title: "Benchmark Node OCPUs"
    description: "Number of OCPUs per benchmark node (minimum 10 for Aeron performance)"
    minimum: 10
    maximum: 128
    default: 16
    required: true
    visible:
      or:
        - eq:
            - ${benchmark_shape}
            - "VM.Standard.E3.Flex"
        - eq:
            - ${benchmark_shape}
            - "VM.Standard.E4.Flex"
        - eq:
            - ${benchmark_shape}
            - "VM.Standard.E5.Flex"
        - eq:
            - ${benchmark_shape}
            - "VM.Standard.E6.Flex"
        - eq:
            - ${benchmark_shape}
            - "VM.Standard3.Flex"
        - eq:
            - ${benchmark_shape}
            - "VM.Optimized3.Flex"
        - eq:
            - ${benchmark_shape}
            - "VM.Standard.A1.Flex"

  benchmark_memory_gb:
    type: integer
    title: "Benchmark Node Memory (GB)"
    description: "Memory in GB per benchmark node"
    minimum: 16
    maximum: 1024
    default: 124
    required: true
    visible:
      or:
        - eq:
            - ${benchmark_shape}
            - "VM.Standard.E3.Flex"
        - eq:
            - ${benchmark_shape}
            - "VM.Standard.E4.Flex"
        - eq:
            - ${benchmark_shape}
            - "VM.Standard.E5.Flex"
        - eq:
            - ${benchmark_shape}
            - "VM.Standard3.Flex"
        - eq:
            - ${benchmark_shape}
            - "VM.Optimized3.Flex"
        - eq:
            - ${benchmark_shape}
            - "VM.Standard.A1.Flex"

  benchmark_boot_volume_size_gb:
    type: integer
    title: "Benchmark Boot Volume Size (GB)"
    minimum: 50
    maximum: 32768
    default: 200
    required: true

  # ==========================================================================
  # Failover Node Configuration (Private Subnet - Different AD)
  # ==========================================================================
  enable_failover_node:
    type: boolean
    title: "Enable Failover Node"
    description: "Create a failover node in a different Availability Domain"
    default: false

  failover_ad:
    type: oci:identity:availabilitydomain:name
    title: "Failover Node Availability Domain"
    description: "Pick an AD different from Benchmark Nodes AD (the console lists all ADs; Terraform rejects the same AD as benchmark_ad). If capacity errors occur, try another AD."
    required: true
    visible:
      eq:
        - ${enable_failover_node}
        - true
    dependsOn:
      compartmentId: ${compartment_ocid}

  failover_shape:
    type: oci:core:instanceshape:name
    title: "Failover Node Shape"
    description: "Compute shape for the failover node"
    default: "VM.Standard.E6.Flex"
    required: true
    visible:
      eq:
        - ${enable_failover_node}
        - true
    dependsOn:
      compartmentId: ${compartment_ocid}

  failover_ocpus:
    type: integer
    title: "Failover Node OCPUs"
    description: "Number of OCPUs for failover node (minimum 10)"
    minimum: 10
    maximum: 128
    default: 16
    visible:
      eq:
        - ${enable_failover_node}
        - true

  failover_memory_gb:
    type: integer
    title: "Failover Node Memory (GB)"
    minimum: 16
    maximum: 1024
    default: 124
    visible:
      eq:
        - ${enable_failover_node}
        - true

  failover_boot_volume_size_gb:
    type: integer
    title: "Failover Boot Volume Size (GB)"
    minimum: 50
    maximum: 32768
    default: 200
    visible:
      eq:
        - ${enable_failover_node}
        - true

  # ==========================================================================
  # Performance Settings
  # ==========================================================================
  hyperthreading:
    type: boolean
    title: "Enable Hyperthreading (SMT)"
    description: "Disabled by default for optimal Aeron benchmarking performance (applies to benchmark/failover nodes only)"
    default: false

  benchmark_cluster_cpu_affinity:
    type: string
    title: "Cluster benchmark CPU affinity"
    description: "auto probes numactl on the cluster receiver (handles HT off and NUMA). static uses only OCPU and hyperthreading from the stack."
    enum:
      - auto
      - static
    default: auto

  grub_dynamic_cpu_isolation:
    type: boolean
    title: "Dynamic GRUB CPU isolation (benchmark nodes)"
    description: "Write GRUB isolcpus/nohz_full/rcu_nocbs/irqaffinity from live logical CPU count. Housekeeping size scales with grub_housekeeping_fraction (no fixed vCPU tiers). Requires reboot after apply."
    default: true

  grub_housekeeping_fraction:
    type: number
    title: "GRUB housekeeping CPU fraction"
    description: "Housekeeping uses ceil(N × fraction), bounded by floor and cap. Default 0.17 matches remediation handoff (~8 CPUs at 48 OCPU)."
    default: 0.17
    minimum: 0.01
    maximum: 0.5
    multipleOf: 0.01

  grub_housekeeping_floor:
    type: number
    title: "GRUB housekeeping CPU floor"
    description: "Minimum housekeeping CPUs (clamped to N). Default 2 per handoff."
    default: 2
    minimum: 1
    maximum: 64

  grub_housekeeping_cpus_max:
    type: number
    title: "GRUB housekeeping CPU cap (0 = none)"
    description: "Maximum housekeeping CPUs (default 8 per handoff). Set 0 to disable upper cap."
    default: 8
    minimum: 0
    maximum: 128

  # ==========================================================================
  # Network Configuration
  # ==========================================================================
  use_existing_vcn:
    type: boolean
    title: "Use Existing VCN"
    description: "Use an existing VCN instead of creating a new one"
    default: false

  create_benchmark_cluster_placement_group:
    type: boolean
    title: "Create benchmark cluster placement group"
    description: "Place benchmark VMs in an OCI cluster placement group in the benchmark AD (tighter physical proximity). Only available when creating a new VCN; cleared when you select Use Existing VCN."
    default: true
    visible:
      and:
        - eq:
            - ${use_existing_vcn}
            - false
        - eq:
            - ${enable_rdma_compute_cluster}
            - false

  enable_benchmark_cluster_network:
    type: boolean
    title: "Enable benchmark cluster network"
    description: "Launch benchmark nodes through an OCI cluster network and instance pool. Use for BM.Optimized3.36 RDMA testing."
    default: false

  enable_benchmark_instance_pool:
    type: boolean
    title: "Enable benchmark instance pool"
    description: "Launch benchmark nodes through a regular OCI instance pool. Do not enable this with benchmark cluster network."
    default: false
    visible:
      eq:
        - ${enable_benchmark_cluster_network}
        - false

  enable_rdma_compute_cluster:
    type: boolean
    title: "Enable RDMA compute cluster for benchmark nodes"
    description: "Launch benchmark nodes into an OCI compute cluster (recommended for RDMA-capable bare-metal shapes like BM.Optimized3.36)."
    default: false
    visible:
      eq:
        - ${enable_benchmark_cluster_network}
        - false

  rdma_existing_compute_cluster_id:
    type: string
    title: "Existing RDMA compute cluster OCID (optional)"
    description: "Leave empty to create a new compute cluster in benchmark AD; set this to attach benchmark nodes to an existing compute cluster."
    default: ""
    visible:
      eq:
        - ${enable_rdma_compute_cluster}
        - true

  rdma_enable_hpc_plugins:
    type: boolean
    title: "Enable OCI RDMA instance agent plugins"
    description: "Enable Compute HPC RDMA Authentication and Compute HPC RDMA Auto-Configuration plugins on benchmark nodes."
    default: true
    visible:
      eq:
        - ${enable_rdma_compute_cluster}
        - true

  benchmark_cloud_init_rdma:
    type: boolean
    title: "Configure RDMA networking in cloud-init"
    description: "Ubuntu/BM.Optimized3 path: install RDMA packages/modules and configure the 100G RoCE interface from cloud-init instead of relying on Oracle Cloud Agent."
    default: false

  benchmark_cloud_init_rdma_interface:
    type: string
    title: "RDMA interface name"
    description: "Target Linux netdev name for the RDMA/RoCE port. The working BM.Optimized3 profile uses eth1."
    default: "eth1"
    visible:
      eq:
        - ${benchmark_cloud_init_rdma}
        - true

  benchmark_cloud_init_rdma_configure_netplan:
    type: boolean
    title: "Create RDMA netplan"
    description: "Match the selected RDMA NIC by MAC, rename it to the RDMA interface name, assign the RDMA fabric IP, set MTU, and bring it up."
    default: true
    visible:
      eq:
        - ${benchmark_cloud_init_rdma}
        - true

  benchmark_cloud_init_rdma_ipv4_prefix:
    type: string
    title: "RDMA IPv4 prefix"
    description: "Prefix excluding host octet. Example: 10.34.100 makes primary 10.34.1.234 become RDMA 10.34.100.234/24."
    default: ""
    visible:
      and:
        - eq:
            - ${benchmark_cloud_init_rdma}
            - true
        - eq:
            - ${benchmark_cloud_init_rdma_configure_netplan}
            - true

  benchmark_cloud_init_rdma_prefix_length:
    type: number
    title: "RDMA IPv4 prefix length"
    description: "Prefix length for the RDMA fabric interface."
    default: 24
    minimum: 1
    maximum: 32
    visible:
      eq:
        - ${benchmark_cloud_init_rdma}
        - true

  benchmark_cloud_init_rdma_mtu:
    type: number
    title: "RDMA interface MTU"
    description: "MTU for the cloud-init configured RDMA interface. The working OCI BM.Optimized3 Ubuntu setup used 4220."
    default: 4220
    minimum: 1500
    maximum: 9000
    visible:
      eq:
        - ${benchmark_cloud_init_rdma}
        - true

  vcn_compartment_ocid:
    type: oci:identity:compartment:id
    title: "VCN Compartment"
    description: "Compartment where VCN exists or will be created"
    default: ${compartment_ocid}
    dependsOn:
      compartmentId: ${tenancy_ocid}

  existing_vcn_id:
    type: oci:core:vcn:id
    title: "Existing VCN"
    description: "Select an existing VCN"
    visible:
      eq:
        - ${use_existing_vcn}
        - true
    dependsOn:
      compartmentId: ${vcn_compartment_ocid}

  existing_public_subnet_id:
    type: oci:core:subnet:id
    title: "Public Subnet (Controller)"
    description: "Select public subnet for controller node"
    visible:
      eq:
        - ${use_existing_vcn}
        - true
    dependsOn:
      compartmentId: ${vcn_compartment_ocid}
      vcnId: ${existing_vcn_id}
      hidePrivateSubnet: true

  existing_private_subnet_id:
    type: oci:core:subnet:id
    title: "Private Subnet (Benchmark/Failover)"
    description: "Select private subnet for benchmark and failover nodes"
    visible:
      eq:
        - ${use_existing_vcn}
        - true
    dependsOn:
      compartmentId: ${vcn_compartment_ocid}
      vcnId: ${existing_vcn_id}
      hidePublicSubnet: true

  vcn_cidr_block:
    type: string
    title: "VCN CIDR Block"
    description: "CIDR block for new VCN"
    default: "10.0.0.0/16"
    visible:
      eq:
        - ${use_existing_vcn}
        - false

  public_subnet_cidr:
    type: string
    title: "Public Subnet CIDR (Controller)"
    description: "CIDR for public subnet where controller is deployed"
    default: "10.0.0.0/24"
    visible:
      eq:
        - ${use_existing_vcn}
        - false

  private_subnet_cidr:
    type: string
    title: "Private Subnet CIDR (Benchmark/Failover)"
    description: "CIDR for private subnet where benchmark and failover nodes are deployed"
    default: "10.0.1.0/24"
    visible:
      eq:
        - ${use_existing_vcn}
        - false

  aeron_benchmark_udp_ingress_cidr:
    type: string
    title: "Benchmark UDP ingress CIDR (optional)"
    description: "Source CIDR for aeron-io/benchmarks UDP (ports ~12000-14000). Leave empty to use VCN CIDR. Existing VCN: also open the same range on the private subnet security list. Same value is passed to benchmark nodes for host iptables when host firewall is enabled."
    default: ""

  aeron_benchmark_configure_host_firewall:
    type: boolean
    title: "Host firewall: allow benchmark UDP"
    description: "On benchmark nodes, insert iptables ACCEPT for UDP 12000-65535 from the effective ingress CIDR (fixes INPUT reject despite OCI NSG/SL)."
    default: true

  aeron_benchmark_host_firewall_persistent:
    type: boolean
    title: "Persist host benchmark UDP iptables rule"
    description: "Install iptables-persistent and save rules after inserting the benchmark UDP rule."
    default: false
    visible:
      eq:
        - ${aeron_benchmark_configure_host_firewall}
        - true

  private_deployment:
    type: boolean
    title: "Private Deployment"
    description: "Deploy controller without public IP (requires VPN/FastConnect)"
    default: false

  # ==========================================================================
  # Image Configuration
  # ==========================================================================
  use_default_image:
    type: boolean
    title: "Use Default Image (Recommended)"
    description: "Use Ubuntu 24.04 Minimal - best for Aeron benchmarking"
    default: true

  default_image_name:
    type: string
    title: "Default Image"
    default: "Canonical-Ubuntu-24.04-Minimal-2025.01.31-0"

  marketplace_image:
    type: enum
    title: "Alternative Marketplace Image"
    description: "Select alternative image if not using default"
    enum:
      - "Canonical-Ubuntu-24.04-Minimal-2025.01.31-0"
      - "Canonical-Ubuntu-24.04-2025.01.31-0"
      - "Canonical-Ubuntu-22.04-Minimal-2025.01.30-0"
      - "Canonical-Ubuntu-22.04-2025.01.30-0"
    default: "Canonical-Ubuntu-24.04-Minimal-2025.01.31-0"
    visible:
      eq:
        - ${use_default_image}
        - false

  custom_image_ocid:
    type: string
    title: "Custom Image OCID"
    description: "Custom image OCID (overrides marketplace selection)"
    default: ""
    visible:
      eq:
        - ${use_default_image}
        - false

  # ==========================================================================
  # Aeron Configuration
  # ==========================================================================
  install_aeron:
    type: boolean
    title: "Install Aeron"
    description: "Install Aeron from Git and build from source"
    default: true

  install_oci_cn_auth:
    type: boolean
    title: "Install and enable oci-cn-auth"
    description: "RDMA mode helper: install and start oci-cn-auth on benchmark/failover nodes (automated for RedHat/Oracle Linux images)."
    default: false
    visible:
      and:
        - eq:
            - ${install_aeron}
            - true
        - eq:
            - ${enable_rdma_compute_cluster}
            - true

  aeron_git_repo:
    type: string
    title: "Aeron Git Repository"
    description: "Git repository URL for Aeron"
    default: "https://github.com/real-logic/aeron.git"

  aeron_git_branch:
    type: string
    title: "Aeron Git Branch/Tag"
    description: "Branch or tag to checkout (leave empty for latest master)"
    default: ""

  benchmarks_repo_url:
    type: string
    title: "Benchmarks Repository URL"
    description: "Official aeron-io/benchmarks repo for LoadTestRig, echo and cluster scenarios"
    default: "https://github.com/aeron-io/benchmarks"

  benchmarks_git_branch:
    type: string
    title: "Benchmarks Repo Branch/Tag"
    description: "Branch or tag (leave empty for master)"
    default: ""

  java_version:
    type: enum
    title: "Java Version"
    description: "OpenJDK version - 17 recommended for Aeron"
    enum:
      - "17"
      - "21"
    default: "17"

  run_smoke_test:
    type: boolean
    title: "Run smoke test after deployment"
    description: "Fast post-apply driver matrix (RUNS=1, ITERATIONS=1, WARMUP=1) to validate echo/cluster wiring. Independent of full benchmark."
    default: true
    visible:
      eq:
        - ${install_aeron}
        - true

  run_full_benchmark:
    type: boolean
    title: "Run full benchmark after deployment"
    description: "Longer post-apply driver matrix (default 5×30×10 warmup) for baseline-style HDR results. When smoke is also enabled, smoke runs first; terraform-matrix-summary uses the full pass. Apply time can be many hours."
    default: false
    visible:
      eq:
        - ${install_aeron}
        - true

  run_benchmarks_matrix_modes:
    type: string
    title: "Benchmark Driver Matrix"
    description: "Comma-separated driver modes (default java,c). java_vma/c_vma use Mellanox VMA (LD_PRELOAD); preflight checks libvma on each host. Optional OpenOnload CLI if ONLOAD_COMMAND_VMA is overridden."
    default: "java,c"
    visible:
      and:
        - eq:
            - ${install_aeron}
            - true
        - or:
            - eq:
                - ${run_smoke_test}
                - true
            - eq:
                - ${run_full_benchmark}
                - true

  run_benchmarks_cluster_matrix:
    type: boolean
    title: "Run Cluster Driver Matrix (Failover)"
    description: "When failover node is enabled, run cluster matrix after echo for each enabled pass (smoke and/or full). Turn off for echo-only CI."
    default: true
    visible:
      and:
        - eq:
            - ${install_aeron}
            - true
        - or:
            - eq:
                - ${run_smoke_test}
                - true
            - eq:
                - ${run_full_benchmark}
                - true

  benchmark_echo_runs:
    type: number
    title: "Echo benchmark RUNS"
    description: "Outer repetitions inside one remote-echo-benchmarks call (paths show run-1, run-2, …). Use 1 to skip repeat passes after a good first result."
    default: 1

  benchmark_echo_iterations:
    type: number
    title: "Echo benchmark ITERATIONS"
    description: "LoadTestRig measurement iterations per RUN (not the same as RUNS or total message count)"
    default: 1

  benchmark_echo_warmup_iterations:
    type: number
    title: "Echo warmup iterations"
    description: "Warmup iterations before measurement"
    default: 1

  benchmark_echo_warmup_message_rate:
    type: string
    title: "Echo warmup message rate"
    description: "Throughput label during warmup (e.g. 25K), not a cap on messages"
    default: "25K"

  benchmark_message_length:
    type: number
    title: "Echo message length (bytes)"
    description: "MESSAGE_LENGTH for echo LoadTestRig (e.g. 288)"
    default: 288

  benchmark_message_rate:
    type: string
    title: "Echo message rate"
    description: "MESSAGE_RATE: numeric msg/s (e.g. 100001) or shorthand (101K). Target throughput, not an exact total message count."
    default: "100001"

  full_benchmark_echo_runs:
    type: number
    title: "Full benchmark RUNS"
    description: "Outer RUNS for post-apply full benchmark matrix (run_full_benchmark=true)."
    default: 5
    minimum: 1

  full_benchmark_echo_iterations:
    type: number
    title: "Full benchmark ITERATIONS"
    description: "Measurement iterations per run for post-apply full benchmark matrix."
    default: 30
    minimum: 1

  full_benchmark_echo_warmup_iterations:
    type: number
    title: "Full benchmark WARMUP_ITERATIONS"
    description: "Warmup iterations before measurement for post-apply full benchmark matrix."
    default: 10
    minimum: 0

  full_benchmark_warmup_message_rate:
    type: string
    title: "Full benchmark warmup message rate"
    description: "WARMUP_MESSAGE_RATE label for full benchmark matrix (e.g. 25K)."
    default: "25K"

  full_benchmark_message_length:
    type: number
    title: "Full benchmark MESSAGE_LENGTH"
    description: "Message size in bytes for post-apply full benchmark matrix."
    default: 288
    minimum: 1

  full_benchmark_message_rate:
    type: string
    title: "Full benchmark MESSAGE_RATE"
    description: "Target rate label for post-apply full benchmark matrix (e.g. 101K)."
    default: "101K"

  full_benchmark_bench_profile:
    type: string
    title: "Full benchmark BENCH_PROFILE"
    description: "Bench profile name passed to wrappers for post-apply full benchmark matrix."
    default: "custom"

  full_benchmark_matrix_mode_timeout_sec:
    type: number
    title: "Full benchmark per-mode timeout (sec)"
    description: "Wall-clock cap per driver mode during post-apply full benchmark matrix."
    default: 7200
    minimum: 60

  benchmark_build_native_aeronmd:
    type: boolean
    title: "Build native Aeron media driver (aeronmd)"
    description: "Required on the controller for echo matrix modes c and c_vma; binaries are synced to benchmark nodes with benchmarks-dist."
    default: true
    visible:
      eq:
        - ${install_aeron}
        - true

  benchmark_onload_command_vma:
    type: string
    title: "VMA launch command override"
    description: "Optional full ONLOAD_COMMAND_VMA override. Leave empty to derive from benchmark_tuning_profile and benchmark_vma_lib_path."
    default: ""

  benchmark_aeron_socket_so_sndbuf:
    type: string
    title: "Aeron send socket buffer override"
    description: "Optional AERON_SOCKET_SO_SNDBUF override. Empty derives from benchmark_tuning_profile."
    default: ""

  benchmark_aeron_socket_so_rcvbuf:
    type: string
    title: "Aeron receive socket buffer override"
    description: "Optional AERON_SOCKET_SO_RCVBUF override. Empty derives from benchmark_tuning_profile."
    default: ""

  benchmark_aeron_rcv_initial_window_length:
    type: string
    title: "Aeron receive initial window override"
    description: "Optional AERON_RCV_INITIAL_WINDOW_LENGTH override. Empty derives from benchmark_tuning_profile."
    default: ""

  benchmark_aeron_max_messages_per_send:
    type: string
    title: "Aeron max messages per send override"
    description: "Optional AERON_NETWORK_PUBLICATION_MAX_MESSAGES_PER_SEND override. Empty derives from benchmark_tuning_profile."
    default: ""

  benchmark_aeron_receiver_io_vector_capacity:
    type: string
    title: "Aeron receiver iovec capacity override"
    description: "Optional AERON_RECEIVER_IO_VECTOR_CAPACITY override. Empty derives from benchmark_tuning_profile."
    default: ""

  benchmark_aeron_sender_io_vector_capacity:
    type: string
    title: "Aeron sender iovec capacity override"
    description: "Optional AERON_SENDER_IO_VECTOR_CAPACITY override. Empty derives from benchmark_tuning_profile."
    default: ""

  aeron_echo_udp_interface_prefix_length:
    type: string
    title: "Echo UDP |interface= prefix length"
    description: "Prefix for Aeron echo channel |interface=LOCAL/prefix. Default auto derives the mask from the private subnet CIDR (benchmark nodes). Set 16 or 24 to override. Empty omits |interface= (diagnostics). Ignored if named interface is set."
    default: "auto"

  aeron_echo_udp_named_interface:
    type: string
    title: "Echo UDP named interface (Aeron 1.50+)"
    description: "NIC name for |interface={name} from ip -br a (e.g. enp0s9 on many OCI VMs; do not assume ens3). Overrides prefix length when set."
    default: ""

  ssh_username:
    type: string
    title: "SSH Username"
    description: "ubuntu for Ubuntu images"
    default: "ubuntu"

  use_instance_principal:
    type: boolean
    title: "Use Instance Principal"
    default: true
